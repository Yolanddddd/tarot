<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>欢迎来到 AuraTarot，请确认你的邮箱</title>
  </head>
  <body style="margin:0;padding:0;background-color:#0a1128;color:#f2e9ff;font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;-webkit-text-size-adjust:100%;">
    <div style="display:none;visibility:hidden;mso-hide:all;max-height:0;max-width:0;overflow:hidden;opacity:0;font-size:1px;line-height:1px;">确认你的邮箱，继续你的提问与探索。</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#0a1128" style="width:100%;border-collapse:collapse;background-color:#0a1128;">
      <tr>
        <td align="center" style="padding:36px 16px;">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;border-collapse:collapse;">
            <tr>
              <td align="center" style="padding:0 0 24px;">
                <p style="margin:0;color:#dbc58a;font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:32px;letter-spacing:3px;">∞ AURATAROT</p>
                <p style="margin:8px 0 0;color:#b4aec9;font-size:12px;line-height:20px;letter-spacing:3px;">占卜空间</p>
              </td>
            </tr>
            <tr>
              <td bgcolor="#111327" style="padding:32px 24px;background-color:#111327;border:1px solid #3a3550;border-radius:16px;">
                <h1 style="margin:0 0 20px;color:#f2e9ff;font-family:'Songti SC',STSong,SimSun,Georgia,serif;font-size:26px;font-weight:600;line-height:38px;">欢迎来到 AuraTarot</h1>
                <p style="margin:0 0 12px;color:#f2e9ff;font-size:16px;line-height:28px;">从一个问题，开始探索。</p>
                <p style="margin:0 0 28px;color:#b4aec9;font-size:15px;line-height:27px;">点击下方按钮确认邮箱，继续你的提问与探索。</p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;">
                  <tr>
                    <td align="center" bgcolor="#dbc58a" style="background-color:#dbc58a;border-radius:8px;mso-padding-alt:12px 24px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;border:12px solid #dbc58a;border-radius:8px;padding:0 12px;color:#111327;font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;font-size:16px;font-weight:700;line-height:24px;text-align:center;text-decoration:none;">确认邮箱并继续</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:20px 0 0;color:#b4aec9;font-size:13px;line-height:23px;">此链接仅可使用一次。若已使用或失效，请回到网站重新申请。</p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:collapse;margin-top:28px;">
                  <tr>
                    <td style="padding-top:24px;border-top:1px solid #3a3550;">
                      <p style="margin:0 0 8px;color:#b4aec9;font-size:12px;line-height:22px;">按钮无法打开？复制下面的链接到浏览器：</p>
                      <p style="margin:0;font-size:12px;line-height:22px;word-break:break-all;overflow-wrap:anywhere;">
                        <a href="{{ .ConfirmationURL }}" style="color:#dbc58a;text-decoration:underline;word-break:break-all;overflow-wrap:anywhere;">{{ .ConfirmationURL }}</a>
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 12px 0;">
                <p style="margin:0;color:#b4aec9;font-size:12px;line-height:22px;">如果你没有发起这次请求，可以直接忽略这封邮件。</p>
                <p style="margin:10px 0 0;color:#b4aec9;font-family:Georgia,'Times New Roman',serif;font-size:12px;line-height:20px;letter-spacing:1px;">AuraTarot</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
